spring.application.name=auth-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plasmit_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:HospitalApp@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No Hibernate / No JPA
# spring.jpa.* remove kar do because JPA dependency use hi nahi kar rahe

jwt.secret=${JWT_SECRET:PlasmitSaasJwtSecretKeyForAuthenticationServiceMinimumLength256Bits}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Correct package logging
logging.level.root=INFO
logging.level.com.plasmit.auth=DEBUG
logging.level.org.springframework.security=INFO

server.error.include-message=always
server.error.include-binding-errors=always
